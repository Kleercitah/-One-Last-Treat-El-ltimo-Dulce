# Publica One Last Treat en GitHub Pages.
# Solo compila el juego: no genera voces, no usa claves de Fish Audio y publica
# exclusivamente el contenido de dist/.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos: leer el repositorio, escribir el sitio y firmar la publicación.
permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; si llega otra, la anterior se descarta.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Instalar dependencias de forma reproducible
        run: npm ci
      - name: Compilar el juego
        run: npm run build
      - name: Subir solo la carpeta compilada
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar el sitio
        id: deployment
        uses: actions/deploy-pages@v4
